version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: milkflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milkflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-milkflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milkflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milkflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-milkflow}:${POSTGRES_PASSWORD:-milkflow_secret}@db:5432/${POSTGRES_DB:-milkflow}
      SECRET_KEY: ${SECRET_KEY:-milkflow_super_secret_production_key_change_me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: milkflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
